<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="alternate" hreflang="it" href="https://professorbriganti.github.io/it/">
<link rel="alternate" hreflang="de" href="https://professorbriganti.github.io/de/">

<meta property="og:type" content="website"><meta property="og:title" content="Prof. Giovanni Briganti | Digital psychiatry clinic"><meta property="og:description" content="Psychiatric consultations by secure video across the European Union with Professor Giovanni Briganti, specialist physician in psychiatry, practising from Belgium and Luxembourg."><meta property="og:url" content="https://professorbriganti.github.io/"><meta property="og:locale" content="en">

<style>.choose{list-style:none;padding:0;margin:2.5rem 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}.choose a{display:block;border-top:2px solid var(--petrol);padding:1rem 0;text-decoration:none;color:var(--ink);font-family:var(--serif);font-size:1.5rem}.choose span{display:block;font-family:var(--sans);font-size:.95rem;color:var(--muted)}</style>
<style>
:root{--paper:#FFFFFF;--mist:#F1F4F5;--ink:#1B2530;--muted:#55616B;--line:#D3D9DD;--petrol:#1F4E5F;--petrol-ink:#FFFFFF;--alert:#F1F4F5;
--serif:"Source Serif 4","Source Serif Pro",Charter,"Iowan Old Style","Palatino Linotype",serif;
--sans:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12191E;--mist:#1A232A;--ink:#E7ECEF;--muted:#A3AEB6;--line:#2E3A42;--petrol:#8CC1D1;--petrol-ink:#0E1A20;--alert:#1A232A}}
:root[data-theme="dark"]{--paper:#12191E;--mist:#1A232A;--ink:#E7ECEF;--muted:#A3AEB6;--line:#2E3A42;--petrol:#8CC1D1;--petrol-ink:#0E1A20;--alert:#1A232A}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--petrol);text-underline-offset:.18em}
a:focus-visible,button:focus-visible{outline:3px solid var(--petrol);outline-offset:3px;border-radius:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:.6rem 1rem;z-index:10}
.skip:focus{left:1rem;top:1rem}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.5rem}
.alert{background:var(--alert);border-bottom:1px solid var(--line);font-size:.95rem}
.alert p{margin:0;padding:.65rem 0}
.alert strong{font-weight:700}
header.top{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;justify-content:space-between;padding:1.4rem 0}
.brand{text-decoration:none;color:var(--ink);line-height:1.2}
.brand b{display:block;font-family:var(--serif);font-weight:600;font-size:1.2rem}
.brand span{color:var(--muted);font-size:.92rem}
nav.langs ul{list-style:none;display:flex;flex-wrap:wrap;gap:.2rem .9rem;margin:0;padding:0;font-size:.93rem}
nav.langs a{color:var(--muted);text-decoration:none}
nav.langs a[aria-current="true"]{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-thickness:2px}
.btn{display:inline-block;background:var(--petrol);color:var(--petrol-ink);text-decoration:none;font-weight:600;padding:.8rem 1.3rem;border-radius:4px}
.btn:hover{filter:brightness(1.08)}
.hero{padding:3.5rem 0 3rem}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.3rem,5.4vw,4.1rem);line-height:1.08;letter-spacing:-.015em;margin:0 0 1.4rem;max-width:17ch}
.lead{font-size:clamp(1.1rem,1.6vw,1.28rem);color:var(--muted);max-width:60ch;margin:0 0 2rem}
.actions{display:flex;flex-wrap:wrap;gap:1rem 1.6rem;align-items:center}
.route{margin:3.2rem 0 0;max-width:760px;position:relative}
.route svg{display:block;width:100%;height:auto;overflow:visible}
.route .solid{stroke:var(--petrol);stroke-width:2.5;fill:none;stroke-dasharray:180;stroke-dashoffset:180;animation:draw 1.1s .3s ease-out forwards}
.route .dash{stroke:var(--petrol);stroke-width:2.5;fill:none;stroke-dasharray:3 9;opacity:0;animation:fade .6s 1.3s forwards}
.route .node{fill:var(--petrol)} .route .home{fill:var(--paper);stroke:var(--petrol);stroke-width:2.5;opacity:0;animation:fade .5s 1.8s forwards}
.route ol{list-style:none;margin:.6rem 0 0;padding:0;display:grid;grid-template-columns:30% 42% 28%;font-size:.92rem;color:var(--muted)}
.route li:last-child{text-align:right}
@keyframes draw{to{stroke-dashoffset:0}} @keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.route .solid,.route .dash,.route .home{animation:none;stroke-dashoffset:0;opacity:1}html{scroll-behavior:auto}}
section{padding:3.4rem 0;border-top:1px solid var(--line)}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.6rem,2.6vw,2.1rem);line-height:1.2;margin:0 0 2rem}
h3{font-size:1.08rem;margin:0 0 .4rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.2rem 3.5rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.2rem 3rem}.grid3 p,.grid2 p,.steps p{margin:0;color:var(--muted);max-width:52ch}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2rem}
.steps li{border-top:2px solid var(--petrol);padding-top:1rem}
.steps .n{font-family:var(--serif);font-size:2.2rem;line-height:1;color:var(--petrol);display:block;margin-bottom:.8rem}
.about{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:3rem;align-items:start}.portrait{width:100%;height:auto;border-radius:4px;display:block;background:var(--mist)}.about p{font-size:1.12rem}
.about p{margin:0 0 1.1rem;max-width:64ch}
.about aside{background:var(--mist);padding:1.4rem 1.5rem;border-radius:4px;font-size:.95rem;align-self:start}
.about aside p{margin:0;color:var(--muted)}
dl.prac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2rem 3.5rem;margin:0}
dl.prac dt{font-weight:700;margin-bottom:.35rem} dl.prac dd{margin:0;color:var(--muted);max-width:52ch}
.contact .mail{font-family:var(--serif);font-size:clamp(1.3rem,3vw,2rem);word-break:break-word}
.contact dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.6rem 2.5rem;margin:2rem 0 0}
.contact dt{font-size:.9rem;color:var(--muted);margin-bottom:.2rem} .contact dd{margin:0}
.privacy p{max-width:70ch;color:var(--muted);margin:0}
footer{border-top:1px solid var(--line);padding:2rem 0 3rem;font-size:.9rem;color:var(--muted)}
footer p{margin:.2rem 0}
@media (max-width:860px){.steps,.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.about{grid-template-columns:minmax(0,240px) minmax(0,1fr)}.contact dl{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.grid2,.grid3,dl.prac,.steps,.contact dl,.about{grid-template-columns:1fr}.portrait{max-width:260px}.hero{padding-top:2rem}.route ol{font-size:.82rem}}
</style>
</head>

</body>
</html>
